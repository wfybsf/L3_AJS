<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>что</title>
</head>
<body>
    <script>
        const delay = () => new Promise(resolve => setTimeout(resolve, 0));
        async function sort_by_title(posts){
            await delay();
            posts.sort((a, b) => b.title.length - a.title.length);
            console.log(posts.map(post =>({ id: post.id, titleLength: post.title.length, title: post.title })));
    }
    async function fetchh(){
        const response = await fetch('https://jsonplaceholder.typicode.com/posts')
        const posts = await response.json();
        await sort_by_title(posts); 
    }
    fetchh()
    </script>
</body>
</html>
