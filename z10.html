<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>что</title>
</head>
<body>
    <script>
        const delay = () => new Promise(resolve => setTimeout(resolve, 0));
        async function sort_by_author(comments){
            await delay();
            comments.sort((a, b) => a.name.localeCompare(b.name));
            console.log(comments.map(comments =>({ id: comments.id, name:comments.name })));
    }
    async function fetchh(){
        const response = await fetch('https://jsonplaceholder.typicode.com/comments')
        const comments = await response.json();
        await sort_by_author(comments); 
    }
    fetchh()
    </script>
</body>
</html>
