<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>что</title>
</head>
<body>
    <script>
        const delay = () => new Promise(resolve => setTimeout(resolve, 0));
        async function incompleted_todos(todos){
            await delay();
            console.log(todos.filter(todo => !todo.completed).map(todo =>({ completed: todo.completed})));
    }
    async function fetchh(){
        const response = await fetch('https://jsonplaceholder.typicode.com/todos')
        const todos = await response.json();
        await incompleted_todos(todos); 
    }
    fetchh()
    </script>
</body>
</html>
