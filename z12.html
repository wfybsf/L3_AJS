<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>что</title>
</head>
<body>
    <script>
        const delay = () => new Promise(resolve => setTimeout(resolve, 0));
        async function users_name(users){
            await delay();
            console.log(users.map(users =>({ name: users.name})));
    }
    async function fetchh(){
        const response = await fetch('https://jsonplaceholder.typicode.com/users')
        const users = await response.json();
        await users_name(users); 
    }
    fetchh()
    </script>
</body>
</html>
