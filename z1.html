<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>что</title>
</head>
<body>
    <script>
        function sort_by_title(posts){
            setTimeout(() =>{posts.sort((a, b) => b.title.length - a.title.length);
            console.log(posts.map(post =>({ id: post.id, titleLength: post.title.length, title: post.title })))});
    }
    fetch('https://jsonplaceholder.typicode.com/posts')
        .then(response => response.json())
        .then(posts => sort_by_title(posts))
    </script>
</body>
</html>
